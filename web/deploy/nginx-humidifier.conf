# nginx site for the humidifier web interface.
# The python service listens on 127.0.0.1:8080 and nginx publishes it on
# port 80.  Static files are served directly by nginx.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    access_log /var/log/nginx/humidifier-access.log;
    error_log  /var/log/nginx/humidifier-error.log;

    client_max_body_size 1m;

    # The static files are served by the python service.  nginx only
    # publishes them, so that the permissions of the home directory do not
    # have to be relaxed for the web server user.
    location /static/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 1h;
        add_header Cache-Control "public";
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }
}
